# Local development overrides (applied automatically by `docker compose up`):
# source mounted into the containers with hot reload.
services:
  migrate:
    environment:
      NODE_ENV: development

  server:
    image: mecatradelink-server:build
    build:
      target: build
    environment:
      NODE_ENV: development
    command: npm run dev
    # The build-stage image has no HEALTHCHECK; the client waits for this one.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      - uploads:/app/uploads

  client:
    image: mecatradelink-client:deps
    build:
      target: deps
      args: {}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5001/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      UPLOADS_PROXY_ORIGIN: http://localhost:5001
      # The optimiser runs inside the container, where localhost:5001 isn't the API.
      NEXT_IMAGE_UNOPTIMIZED: "true"
    command: npm run dev
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      - client_next:/app/.next

volumes:
  server_node_modules:
  client_node_modules:
  client_next:
