name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          DIRECT_URL: postgresql://x:x@localhost:5432/x
      - run: npx prisma generate
      - run: npm run check

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
          NEXT_PUBLIC_SITE_URL: https://example.com
          INTERNAL_API_ORIGIN: https://api.example.com

  docker:
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: mecatradelink-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: false
          tags: mecatradelink-client:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com/api/v1
            NEXT_PUBLIC_SITE_URL=https://example.com
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
